name: Build Omni Image

on:
  push:
    branches: [main]
    paths:
      - '10/omni/**'
      - '.github/workflows/build-omni.yml'
  pull_request:
    branches: [main]
    paths:
      - '10/omni/**'
      - '.github/workflows/build-omni.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: rocky-bootc
  OMNI_IMAGE_NAME: rocky-bootc-omni

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install podman and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman fuse-overlayfs skopeo

      - name: Build base image (Rocky 10)
        run: |
          sudo podman build \
            --platform=linux/amd64 \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            -t ${{ env.IMAGE_NAME }}:latest \
            -f 10/Containerfile \
            .

      - name: Generate temporary cosign keypair
        run: |
          sudo apt-get install -y -qq golang-go 2>/dev/null || true
          if ! command -v cosign &>/dev/null; then
            go install github.com/sigstore/cosign/v2/cmd/cosign@latest
            export PATH="$HOME/go/bin:$PATH"
          fi
          mkdir -p 10/omni/zarf
          cd 10/omni/zarf
          COSIGN_PASSWORD="" cosign generate-key-pair

      - name: Build Zarf packages
        run: |
          export PATH="$HOME/go/bin:$PATH"
          ./scripts/zarf-build-packages.sh

      - name: Build Omni image
        run: |
          sudo podman build \
            --build-arg BASE_IMAGE=localhost/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.OMNI_IMAGE_NAME }}:latest \
            -f 10/omni/Containerfile \
            .

      - name: Verify image
        run: |
          sudo podman inspect ${{ env.OMNI_IMAGE_NAME }}:latest \
            --format '{{.Id}} {{.Size}}'
