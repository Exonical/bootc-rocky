kind: ZarfPackageConfig
metadata:
  name: talos-k8s
  version: 1.36.0
  architecture: amd64
  description: |
    Talos Linux Kubernetes 1.36.0 control plane and node images. Matches
    `talosctl images k8s-bundle` for v1.36.0. Mirrored into Zot at
    localhost:5000 for downstream Talos worker nodes.

    Talos worker config:
      machine:
        registries:
          mirrors:
            registry.k8s.io: { endpoints: [ "http://<omni-host>:5000" ] }
            ghcr.io:         { endpoints: [ "http://<omni-host>:5000" ] }

components:
  - name: kubernetes-images
    description: Core control-plane + worker images for Kubernetes 1.36.0.
    required: true
    images:
      - registry.k8s.io/kube-apiserver:v1.36.0
      - registry.k8s.io/kube-controller-manager:v1.36.0
      - registry.k8s.io/kube-scheduler:v1.36.0
      - registry.k8s.io/kube-proxy:v1.36.0
      - registry.k8s.io/coredns/coredns:v1.14.2
      - registry.k8s.io/etcd:v3.6.9
      - registry.k8s.io/pause:3.10.1
      - registry.k8s.io/networking/kube-network-policies:v1.0.0
      - ghcr.io/siderolabs/kubelet:v1.36.0
