# /usr/lib/tmpfiles.d/omni.conf
# Persistent-state directories for the host quadlet stack.
#
# bootc forbids pre-creating directories under /var in the image (the
# `var-tmpfiles` lint check; /var is treated as machine-state, not image
# content). systemd-tmpfiles --create runs early at boot and materialises
# these so the Quadlets that bind-mount them can start.
#
# Type Path           Mode UID  GID  Age Argument
d      /var/lib/zot   0755 root root -   -
d      /var/lib/omni  0755 root root -   -
d      /var/lib/zarf  0755 root root -   -
